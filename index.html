<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lemi's Arknights Tactics & Central Guide</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #121826;
      --bg-card-hover: #1a2333;
      --cyan-main: #00f0ff;
      --cyan-dim: #008080;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      background-color: rgba(0, 0, 0, 0.8);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background-color: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--cyan-main);
      color: var(--cyan-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 4px;
    }

    .logo-text h1 {
      font-size: 16px;
      color: var(--cyan-main);
      letter-spacing: 1px;
    }

    .logo-text p {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 2px;
    }

    .admin-btn {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: var(--cyan-main);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: 0.2s;
    }

    .admin-btn:hover {
      background-color: #334155;
    }

    /* MAIN CONTAINER */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      flex-grow: 1;
    }

    /* MODE SELECTOR */
    .mode-selector {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 8px;
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .mode-btn {
      background-color: #1e293b;
      color: var(--text-muted);
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      transition: 0.2s;
    }

    .mode-btn.active {
      background-color: var(--cyan-main);
      color: #000;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    /* TABS */
    .nav-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      border-bottom: 2px solid transparent;
      transition: 0.2s;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--cyan-main);
      border-bottom-color: var(--cyan-main);
      background-color: rgba(0, 240, 255, 0.05);
    }

    /* CONTENT GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 6px;
      position: relative;
    }

    .card::after {
      content: '';
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 6px;
      height: 6px;
      background-color: var(--cyan-main);
    }

    .card h3 {
      color: var(--cyan-main);
      font-size: 15px;
      margin-bottom: 8px;
    }

    .card p {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .search-input {
      width: 100%;
      max-width: 300px;
      padding: 8px 12px;
      background-color: #000;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 4px;
      margin-bottom: 16px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--cyan-main);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background-color: var(--bg-card);
      border: 1px solid var(--cyan-main);
      width: 100%;
      max-width: 450px;
      padding: 20px;
      border-radius: 8px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .input-group input {
      flex-grow: 1;
      padding: 8px;
      background-color: #000;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 4px;
    }

    .input-group button {
      background-color: var(--cyan-main);
      color: #000;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- HEADER NAVBAR -->
  <header>
    <div class="header-container">
      <div class="logo-area">
        <div class="logo-icon">PRTS</div>
        <div class="logo-text">
          <h1>LEMI'S ARKNIGHTS TACTICS</h1>
          <p>STRATEGY &amp; GUIDE HUB</p>
        </div>
      </div>
      <button class="admin-btn" id="openAdminBtn">โหมดแก้ไข (Admin)</button>
    </div>
  </header>

  <!-- MAIN AREA -->
  <main>
    <!-- MODE SWITCHER -->
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="IS">Integrated Strategies (IS)</button>
      <button class="mode-btn" data-mode="STRONGHOLD">Stronghold Protocol</button>
    </div>

    <!-- TABS -->
    <div class="nav-tabs">
      <button class="tab-btn active" data-tab="overview">ภาพรวม &amp; ธีม</button>
      <button class="tab-btn" data-tab="relics">คลังบัฟ &amp; อุปกรณ์</button>
      <button class="tab-btn" data-tab="stages">ไกด์ด่าน &amp; บอส</button>
      <button class="tab-btn" data-tab="operators">Tier List โอเปอเรเตอร์</button>
    </div>

    <!-- TAB CONTENTS -->
    <div id="overview" class="tab-content active">
      <h2 id="overviewTitle" style="margin-bottom: 16px; font-size: 18px; border-left: 4px solid var(--cyan-main); padding-left: 10px;">หัวข้อในโหมด Integrated Strategies</h2>
      <div id="overviewList" class="grid"></div>
    </div>

    <div id="relics" class="tab-content">
      <input type="text" id="relicSearch" class="search-input" placeholder="ค้นหา Relic / Buff...">
      <div id="relicList" class="grid"></div>
    </div>

    <div id="stages" class="tab-content">
      <div id="stageList" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </div>

    <div id="operators" class="tab-content">
      <div id="operatorList" class="grid"></div>
    </div>
  </main>

  <!-- ADMIN MODAL -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="color: var(--cyan-main);">Admin Control Panel</h3>
        <button class="close-btn" id="closeAdminBtn">&times;</button>
      </div>
      <p style="font-size: 13px; color: var(--text-muted);">ใส่รหัสผ่านเพื่อล็อกอินแก้ไขข้อมูล:</p>
      <div class="input-group">
        <input type="password" id="adminPassInput" placeholder="รหัสทดสอบ: 1234">
        <button id="adminLoginBtn">เข้าสู่ระบบ</button>
      </div>
    </div>
  </div>

  <script>
    // DATABASE
    let currentMode = 'IS';
    const db = {
      IS: {
        label: "Integrated Strategies",
        overview: [
          { name: "IS1: Phantom & Crimson Solitaire", desc: "ตะลุยโรงละครวิญญาณ Manticore / Phantom" },
          { name: "IS2: Mizuki & Caerula Arbor", desc: "ดำดิ่งสู่โลกใต้ทะเลลึก Seaborn" },
          { name: "IS3: Expeditions in the Icefield", desc: "การเดินทางในทุ่งหิมะทางเหนือ" },
          { name: "IS4: Tales Within the Sand", desc: "การผจญภัยกลางทะเลทรายและซากอารยธรรมโบราณ" }
        ],
        relics: [
          { name: "King's Crystal", desc: "สโลว์ศัตรูรายรอบ 20%" },
          { name: "Spinach Pack", desc: "กดใช้สกิลแล้วเพิ่ม ATK +60%" }
        ],
        stages: [
          { name: "Lucian the Blood Diamond", desc: "เน้นตัวหยุดจังหวะ สปีดบอสไวมาก" }
        ],
        operators: [
          { name: "Texas the Omertosa", desc: "Specialist - Tier S+" }
        ]
      },
      STRONGHOLD: {
        label: "Stronghold Protocol",
        overview: [
          { name: "ระบบป้องกันพื้นที่ Stronghold Zone", desc: "จัดกำลังวางแนวตั้งรับคลื่นศัตรูตามเฟสที่กำหนด" },
          { name: "การจัดสรร Tactics Modules & Buffs", desc: "เลือกบัฟประจำทีมเพื่อเสริมความแข็งแกร่งให้สายอาชีพหลัก" }
        ],
        relics: [
          { name: "Reinforced Module A", desc: "เพิ่ม DEF ให้กลุ่ม Defender และ Guard ขึ้น 25%" },
          { name: "Energy Converter", desc: "เร่งการฟื้นฟู DP ขึ้น 1.5 เท่าในขณะตั้งรับ" }
        ],
        stages: [
          { name: "Stronghold Protocol: Sector 3", desc: "เตรียมตัวรับมือศัตรูประเภทเกราะหนาหนักระลอกใหญ่" }
        ],
        operators: [
          { name: "Mlynar", desc: "Guard - Tier S+" },
          { name: "Saria", desc: "Defender - Tier S+" }
        ]
      }
    };

    // RENDER CONTENT
    function render() {
      const data = db[currentMode];

      // Overview
      document.getElementById('overviewTitle').innerText = "หัวข้อในโหมด " + data.label;
      document.getElementById('overviewList').innerHTML = data.overview.map(i => `
        <div class="card">
          <h3>${i.name}</h3>
          <p>${i.desc}</p>
        </div>
      `).join('');

      // Relics
      const search = document.getElementById('relicSearch').value.toLowerCase();
      const filteredRelics = data.relics.filter(r => r.name.toLowerCase().includes(search) || r.desc.toLowerCase().includes(search));
      document.getElementById('relicList').innerHTML = filteredRelics.map(r => `
        <div class="card">
          <h3 style="color: #ffb700;">${r.name}</h3>
          <p>${r.desc}</p>
        </div>
      `).join('');

      // Stages
      document.getElementById('stageList').innerHTML = data.stages.map(s => `
        <div class="card">
          <h3 style="color: #ff4757;">${s.name}</h3>
          <p>${s.desc}</p>
        </div>
      `).join('');

      // Operators
      document.getElementById('operatorList').innerHTML = data.operators.map(o => `
        <div class="card">
          <h3>${o.name}</h3>
          <p>${o.desc}</p>
        </div>
      `).join('');
    }

    // EVENT LISTENERS
    document.addEventListener('DOMContentLoaded', () => {
      render();

      // Mode Switcher Buttons
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentMode = e.target.getAttribute('data-mode');
          render();
        });
      });

      // Tab Buttons
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          
          e.target.classList.add('active');
          const tabId = e.target.getAttribute('data-tab');
          document.getElementById(tabId).classList.add('active');
        });
      });

      // Search Filter
      document.getElementById('relicSearch').addEventListener('input', render);

      // Admin Modal Controls
      const modal = document.getElementById('adminModal');
      document.getElementById('openAdminBtn').addEventListener('click', () => modal.classList.add('active'));
      document.getElementById('closeAdminBtn').addEventListener('click', () => modal.classList.remove('active'));
      document.getElementById('adminLoginBtn').addEventListener('click', () => {
        const pass = document.getElementById('adminPassInput').value;
        if (pass === '1234') {
          alert('เข้าสู่ระบบ Admin สำเร็จ!');
          modal.classList.remove('active');
        } else {
          alert('รหัสผ่านไม่ถูกต้อง (รหัสทดสอบ: 1234)');
        }
      });
    });
  </script>
</body>
</html>
